<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'quiz/style.css' %}">

    
</head>

<body>
<div class="box">
    <h2>Register</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign Up</button>
</form>

<p>
    Already have an account?
    <a href="{% url 'login' %}">Login</a>
</p>
</div>

</body>
</html>
